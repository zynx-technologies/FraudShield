# Pull request validation for infrastructure, Kubernetes manifests, scripts, and services.
# No Azure access. Make this a required check on main with a branch policy.
trigger:
  branches:
    include: ['*']
    exclude: [releases]
pr:
  branches:
    include: [main]

variables:
  - template: templates/variables.yml

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Validate
    jobs:
      - template: templates/validate-jobs.yml