# Model promotion (design section 8). Run by hand for one Unity Catalog model version.
#   shadow   checks validation, fairness, explainability, performance, and the signed artifact, then
#            runs the version as a shadow challenger in every environment. It never affects a decision.
#   release  also checks 14 days of stable shadow and an approval by the model risk owner (not the
#            author), then rolls it out as a canary: dev, test, perf, prod. Argo Rollouts rolls back
#            automatically on breached limits. After prod, the "champion" alias moves to this version.
trigger: none
pr: none

parameters:
  - name: model
    displayName: Model
    type: string
    default: fs_txn
    values: [fs_txn, fs_anomaly]
  - name: version
    displayName: Unity Catalog model version
    type: string
  - name: action
    displayName: Action
    type: string
    default: shadow
    values: [shadow, release]

variables:
  - template: templates/variables.yml
  - group: fraudshield-shared
  - group: fraudshield-prod
  - name: UC_MODEL
    value: fraudshield_prod.models.${{ parameters.model }}

stages:
  - stage: Gates
    jobs:
      - job: Check
        # The production Databricks workspace is private.
        pool:
          name: fraudshield-private
        steps:
          - task: AzureCLI@2
            displayName: Check promotion gates
            inputs:
              azureSubscription: fraudshield-azure
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                python3 -m pip install --quiet "mlflow-skinny>=2.19,<3"
                export DATABRICKS_HOST="$(DATABRICKS_HOST)" DATABRICKS_AUTH_TYPE=azure-cli
                python3 azure-pipelines/scripts/check_model_gates.py \
                  --model "$(UC_MODEL)" --version "${{ parameters.version }}" --stage ${{ parameters.action }}
          - publish: $(Build.ArtifactStagingDirectory)/model-gates.json
            artifact: model-gate-evidence
            condition: always()

  - ${{ each env in split('dev,test,perf,prod', ',') }}:
      - stage: Model_${{ env }}
        displayName: ${{ parameters.action }} in ${{ env }}
        ${{ if eq(env, 'dev') }}:
          dependsOn: Gates
        ${{ if eq(env, 'test') }}:
          dependsOn: Model_dev
        ${{ if eq(env, 'perf') }}:
          dependsOn: Model_test
        ${{ if eq(env, 'prod') }}:
          dependsOn: Model_perf
        variables:
          - group: fraudshield-${{ env }}
        pool:
          vmImage: ubuntu-24.04
        jobs:
          - deployment: Promote
            environment: fraudshield-${{ env }}
            timeoutInMinutes: 180
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                      fetchDepth: 1
                    - task: AzureCLI@2
                      displayName: Update the model version and wait for the rollout
                      inputs:
                        azureSubscription: fraudshield-azure
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          set -euo pipefail
                          version="${{ parameters.version }}"
                          if [[ "${{ parameters.action }}" == shadow ]]; then
                            expr=".model.shadowVersion = \"$version\""
                            expect="FRAUDSHIELD_SHADOW_MODEL_VERSION=$version"
                          else
                            expr=".model.version = \"$version\" | .model.shadowVersion = \"\""
                            expect="FRAUDSHIELD_MODEL_VERSION=$version"
                          fi
                          azure-pipelines/scripts/commit-release.sh "environments/${{ env }}/model.yaml" "$expr" \
                            "${{ parameters.action }} ${{ parameters.model }} v$version in ${{ env }} (build $(Build.BuildNumber))"
                          # Config changes roll the pods, so the canary and its analysis run here too.
                          azure-pipelines/scripts/wait-for-rollout.sh config "$expect" 150 decision,scoring
                        env:
                          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - ${{ if eq(parameters.action, 'release') }}:
      - stage: Champion
        displayName: Mark as champion
        dependsOn: Model_prod
        jobs:
          - job: Alias
            pool:
              name: fraudshield-private
            steps:
              - task: AzureCLI@2
                inputs:
                  azureSubscription: fraudshield-azure
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    python3 -m pip install --quiet "mlflow-skinny>=2.19,<3"
                    export DATABRICKS_HOST="$(DATABRICKS_HOST)" DATABRICKS_AUTH_TYPE=azure-cli
                    python3 -c "from mlflow import MlflowClient; MlflowClient(registry_uri='databricks-uc').set_registered_model_alias('$(UC_MODEL)', 'champion', '${{ parameters.version }}')"