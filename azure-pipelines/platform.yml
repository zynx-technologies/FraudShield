# Cluster add-ons: namespace, internal ingress, Argo Rollouts, Prometheus, Argo CD, and the FraudShield
# ApplicationSet. Run it after the first infrastructure apply of an environment, and whenever
# deploy/platform or deploy/gitops/argocd changes.
trigger:
  branches:
    include: [main]
  paths:
    include: [deploy/platform, deploy/gitops/argocd]
pr: none

parameters:
  - name: environments
    displayName: Environments
    type: object
    default: [dev, test]

variables:
  - template: templates/variables.yml
  - group: fraudshield-shared

pool:
  vmImage: ubuntu-24.04

stages:
  - ${{ each env in parameters.environments }}:
      - stage: Platform_${{ env }}
        displayName: Platform add-ons in ${{ env }}
        variables:
          - group: fraudshield-${{ env }}
        jobs:
          - deployment: Install
            environment: fraudshield-${{ env }}
            timeoutInMinutes: 60
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                      fetchDepth: 0
                    - script: git fetch --quiet origin releases
                      displayName: Fetch release state
                    - task: HelmInstaller@1
                      inputs:
                        helmVersionToInstall: $(HELM_VERSION)
                    - task: AzureCLI@2
                      displayName: Install add-ons in each cluster
                      inputs:
                        azureSubscription: fraudshield-azure
                        scriptType: bash
                        scriptLocation: scriptPath
                        scriptPath: azure-pipelines/scripts/install-platform.sh
                        arguments: ${{ env }}
                      env:
                        GITOPS_REPO_TOKEN: $(GITOPS_REPO_TOKEN)