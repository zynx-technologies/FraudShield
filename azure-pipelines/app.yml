# Services and portal. Builds every image once, scans it, and promotes the same tag through each
# environment via the releases branch. Argo CD deploys it and Argo Rollouts runs the canary.
# Merges deploy dev, then test. Perf and prod run only when "Release to perf and production" is chosen;
# prod also needs its environment approvers.
trigger:
  branches:
    include: [main]
  paths:
    include: [services, portal, deploy/helm]
pr: none

parameters:
  - name: releaseToProduction
    displayName: Release to perf and production after test
    type: boolean
    default: false
  - name: services
    type: object
    default: [decision, case, strategy, copilot]

variables:
  - template: templates/variables.yml
  - group: fraudshield-shared
  - name: IMAGE_TAG
    value: $(Build.SourceVersion)

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Validate
    jobs:
      - template: templates/validate-jobs.yml

  - stage: Build
    dependsOn: Validate
    jobs:
      - job: Images
        timeoutInMinutes: 90
        steps:
          - task: AzureCLI@2
            displayName: Build and scan images
            inputs:
              azureSubscription: fraudshield-azure
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                TOKEN="$(az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv)"
                build() {
                  local name="$1"; shift
                  image="fraudshield-$name:$IMAGE_TAG"
                  az acr build --registry "$ACR_NAME" --image "$image" --platform linux/amd64 "$@"
                  docker run --rm aquasec/trivy:$(TRIVY_VERSION) image \
                    --username 00000000-0000-0000-0000-000000000000 --password "$TOKEN" \
                    --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$ACR_NAME.azurecr.io/$image"
                }
                # Every Java service builds from one Dockerfile in the services folder (one Maven reactor).
                for svc in ${{ join(' ', parameters.services) }}; do
                  build "$svc" --file services/Dockerfile --build-arg "SERVICE=$svc" services
                done
                build portal portal

  - template: templates/release-stage.yml
    parameters:
      environment: dev
      dependsOn: [Build]
      timeoutMinutes: 30

  - template: templates/release-stage.yml
    parameters:
      environment: test
      dependsOn: [Release_dev]
      timeoutMinutes: 45

  - ${{ if parameters.releaseToProduction }}:
      - template: templates/release-stage.yml
        parameters:
          environment: perf
          dependsOn: [Release_test]
          timeoutMinutes: 90

      # The production canary pauses at 5% for 10 minutes and at 25% for 30 minutes, in each region.
      - template: templates/release-stage.yml
        parameters:
          environment: prod
          dependsOn: [Release_perf]
          timeoutMinutes: 180