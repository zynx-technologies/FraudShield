# Plan, then apply the saved plan, for one environment.
# The plan is published as an artifact and summarised, so approvers see exactly what will change.
# Apply runs as a deployment job, so the environment's approvals and checks apply. Prod must have approvers.
parameters:
  - name: environment
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: apply
    type: boolean
    default: true

stages:
  - stage: Plan_${{ parameters.environment }}
    displayName: Plan ${{ parameters.environment }}
    dependsOn: ${{ parameters.dependsOn }}
    # An earlier environment with no changes skips its apply. That must not block this one.
    condition: and(not(failed()), not(canceled()))
    variables:
      - group: fraudshield-${{ parameters.environment }}
    jobs:
      - job: Plan
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TERRAFORM_VERSION)
          - task: AzureCLI@2
            name: terraform
            displayName: Terraform plan
            inputs:
              azureSubscription: fraudshield-azure
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: azure-pipelines/scripts/terraform.sh
              arguments: plan ${{ parameters.environment }}
              addSpnToEnvironment: true
            env:
              TF_VAR_apim_publisher_email: $(APIM_PUBLISHER_EMAIL)
              TF_VAR_sql_admin_group_name: $(SQL_ADMIN_GROUP_NAME)
              TF_VAR_sql_admin_group_object_id: $(SQL_ADMIN_GROUP_OBJECT_ID)
              TF_VAR_channel_source_cidrs: $(CHANNEL_SOURCE_CIDRS)
              TF_VAR_aks_admin_group_object_ids: $(AKS_ADMIN_GROUP_OBJECT_IDS)
              TF_VAR_alert_emails: $(ALERT_EMAILS)
              TF_VAR_origin_host_name: $(ORIGIN_HOST_NAME)
              TF_VAR_origin_certificate_secret_id: $(ORIGIN_CERTIFICATE_SECRET_ID)
              TF_VAR_entra_api_client_id: $(ENTRA_API_CLIENT_ID)
              TF_VAR_entra_spa_client_id: $(ENTRA_SPA_CLIENT_ID)
          - publish: infra/terraform/tfplan
            artifact: tfplan-${{ parameters.environment }}
            condition: and(succeeded(), eq(variables['PLAN_HAS_CHANGES'], 'true'))

  - ${{ if parameters.apply }}:
      - stage: Apply_${{ parameters.environment }}
        displayName: Apply ${{ parameters.environment }}
        dependsOn: Plan_${{ parameters.environment }}
        condition: and(succeeded(), eq(dependencies.Plan_${{ parameters.environment }}.outputs['Plan.terraform.PLAN_HAS_CHANGES'], 'true'))
        variables:
          - group: fraudshield-${{ parameters.environment }}
        jobs:
          - deployment: Apply
            environment: fraudshield-${{ parameters.environment }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                      fetchDepth: 1
                    - download: current
                      artifact: tfplan-${{ parameters.environment }}
                    - task: TerraformInstaller@1
                      inputs:
                        terraformVersion: $(TERRAFORM_VERSION)
                    - task: AzureCLI@2
                      displayName: Terraform apply and publish platform values
                      inputs:
                        azureSubscription: fraudshield-azure
                        scriptType: bash
                        scriptLocation: scriptPath
                        scriptPath: azure-pipelines/scripts/terraform.sh
                        arguments: apply ${{ parameters.environment }} $(Pipeline.Workspace)/tfplan-${{ parameters.environment }}/tfplan
                        addSpnToEnvironment: true
                      env:
                        SYSTEM_ACCESSTOKEN: $(System.AccessToken)