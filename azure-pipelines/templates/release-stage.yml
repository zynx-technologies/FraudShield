# Promotes one image tag to one environment by updating the releases branch, then waits until Argo CD
# has synced and every Rollout is Healthy in every cluster. Canary analysis runs inside the cluster, so a
# failing canary rolls itself back and this stage fails.
parameters:
  - name: environment
    type: string
  - name: dependsOn
    type: object
  - name: timeoutMinutes
    type: number
    default: 30

stages:
  - stage: Release_${{ parameters.environment }}
    displayName: Release to ${{ parameters.environment }}
    dependsOn: ${{ parameters.dependsOn }}
    variables:
      - group: fraudshield-${{ parameters.environment }}
    jobs:
      - deployment: Release
        environment: fraudshield-${{ parameters.environment }}
        timeoutInMinutes: ${{ parameters.timeoutMinutes }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                - task: AzureCLI@2
                  displayName: Set the image tag and wait for the rollout
                  inputs:
                    azureSubscription: fraudshield-azure
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      azure-pipelines/scripts/commit-release.sh \
                        "environments/${{ parameters.environment }}/release.yaml" \
                        ".global.imageTag = \"$(IMAGE_TAG)\"" \
                        "Release $(IMAGE_TAG) to ${{ parameters.environment }} (build $(Build.BuildNumber))"
                      azure-pipelines/scripts/wait-for-rollout.sh image "$(IMAGE_TAG)" ${{ parameters.timeoutMinutes }}
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)