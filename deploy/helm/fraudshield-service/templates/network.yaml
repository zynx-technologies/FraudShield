apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fs.name" . }}
  labels:
    {{- include "fs.labels" . | nindent 4 }}
  {{- if .Values.workloadIdentity }}
  annotations:
    azure.workload.identity/client-id: {{ required (printf "identities.%s is required" .Values.serviceName) (index .Values.identities .Values.serviceName) | quote }}
    azure.workload.identity/tenant-id: {{ .Values.global.tenantId | default "" | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fs.name" . }}
  labels:
    {{- include "fs.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fs.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.rollout.enabled }}
---
# Argo Rollouts points this at the canary pods during a rollout.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fs.name" . }}-canary
  labels:
    {{- include "fs.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fs.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fs.name" . }}
  labels:
    {{- include "fs.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.bodySize | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "fs.name" $ }}
                port:
                  name: http
          {{- end }}
{{- end }}
---
# Default deny is applied per namespace by deploy/platform/namespace.yaml. This opens only what each
# service needs: traffic from the ingress controller and Prometheus, and from other FraudShield pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fs.name" . }}
  labels:
    {{- include "fs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fs.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: fraudshield
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fs.name" . }}
  labels:
    {{- include "fs.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "fs.selector" . | nindent 6 }}
{{- if .Values.autoscaling.enabled }}
---
# KEDA scales on CPU. Pre-warmed minimums matter more than reaction time for the 200 ms budget.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "fs.name" . }}
  labels:
    {{- include "fs.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: {{ ternary "argoproj.io/v1alpha1" "apps/v1" .Values.rollout.enabled }}
    kind: {{ ternary "Rollout" "Deployment" .Values.rollout.enabled }}
    name: {{ include "fs.name" . }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.autoscaling.cpuUtilization | quote }}
{{- end }}
