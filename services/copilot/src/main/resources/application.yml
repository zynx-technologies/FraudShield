server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: copilot
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:}
          audiences: ${ENTRA_API_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

fraudshield:
  services:
    case-url: ${CASE_SERVICE_URL:http://localhost:8082}
  copilot:
    # Kill switch. When false, the portal shows that Copilot is off and every other screen keeps working.
    enabled: ${FRAUDSHIELD_COPILOT_ENABLED:true}
    # extractive: fixed templates, no language model. azure-openai: the Foundry deployment, after approval.
    provider: ${FRAUDSHIELD_COPILOT_PROVIDER:extractive}
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    deployment: ${AZURE_OPENAI_DEPLOYMENT:}