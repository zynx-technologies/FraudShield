server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: case
  threads:
    virtual:
      enabled: true
  datasource:
    # Azure SQL with the service's managed identity, for example:
    # jdbc:sqlserver://<host>:1433;database=fraudshield;encrypt=true;authentication=ActiveDirectoryDefault
    url: ${DATABASE_URL:}
  flyway:
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    # Case and strategy share one database, each with its own migration history.
    table: flyway_case_history
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:}
          audiences: ${ENTRA_API_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

fraudshield:
  auth:
    service-scope: ${FRAUDSHIELD_SERVICE_SCOPE:}
  services:
    decision-url: ${DECISION_SERVICE_URL:http://localhost:8080}
  time-zone: Europe/London
  sla:
    score-90-plus: 15m
    score-80-plus: 30m
    other: 60m
  seed:
    enabled: ${FRAUDSHIELD_SEED_ENABLED:false}